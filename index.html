<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Meghalaya & Kamakhya Expedition | Dec 2026</title>
  
  <!-- Google Fonts & Leaflet CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --primary: #059669;
      --primary-dark: #047857;
      --primary-light: #ecfdf5;
      --accent: #2563eb;
      --dark: #0f172a;
      --slate: #475569;
      --light-bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--light-bg);
      color: var(--dark);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar / Drawer */
    #sidebar {
      width: 420px;
      height: 100%;
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: var(--shadow);
    }

    .brand-header {
      padding: 20px 24px;
      background: linear-gradient(135deg, #064e3b 0%, #065f46 100%);
      color: white;
      position: relative;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(8px);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .brand-header h1 {
      font-size: 20px;
      font-weight: 800;
      line-height: 1.3;
    }

    .brand-meta {
      font-size: 13px;
      opacity: 0.85;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Filter Chips */
    .filter-wrapper {
      padding: 12px 16px;
      background: white;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .filter-wrapper::-webkit-scrollbar { display: none; }

    .chip-group {
      display: inline-flex;
      gap: 8px;
    }

    .filter-btn {
      padding: 8px 16px;
      border-radius: 30px;
      border: 1px solid var(--border);
      background: #f1f5f9;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--slate);
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .filter-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.3);
    }

    /* Content Area */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .day-card {
      background: white;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      transition: all 0.2s ease;
    }

    .day-card:hover {
      border-color: #cbd5e1;
    }

    .day-card-header {
      padding: 14px 18px;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .day-title {
      font-weight: 700;
      font-size: 14.5px;
      color: var(--dark);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .day-date {
      font-size: 12px;
      color: var(--slate);
      font-weight: 600;
    }

    .stop-list {
      padding: 12px 16px;
      list-style: none;
    }

    .stop-item {
      position: relative;
      padding-left: 28px;
      margin-bottom: 16px;
      cursor: pointer;
    }

    .stop-item:last-child {
      margin-bottom: 4px;
    }

    .stop-item::before {
      content: '';
      position: absolute;
      left: 7px;
      top: 22px;
      bottom: -16px;
      width: 2px;
      background: #e2e8f0;
    }

    .stop-item:last-child::before {
      display: none;
    }

    .stop-dot {
      position: absolute;
      left: 0;
      top: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 3px solid white;
      background: var(--primary);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.15);
    }

    .stop-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 3px;
    }

    .stop-name {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--dark);
    }

    .stop-item:hover .stop-name {
      color: var(--primary);
    }

    .badge-trek {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 12px;
      letter-spacing: 0.3px;
    }

    .trek-zero { background: #e0f2fe; color: #0369a1; }
    .trek-easy { background: #dcfce7; color: #15803d; }
    .trek-mod { background: #fef3c7; color: #b45309; }
    .trek-hard { background: #fee2e2; color: #b91c1c; }

    .stop-desc {
      font-size: 12px;
      color: var(--slate);
      line-height: 1.45;
    }

    .stop-links {
      margin-top: 6px;
      display: flex;
      gap: 12px;
    }

    .map-link-btn {
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .map-link-btn:hover { text-decoration: underline; }

    /* Map Styles */
    #map {
      flex: 1;
      height: 100%;
      position: relative;
    }

    /* Floating Navigation Controls */
    .mobile-nav-toggle {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1001;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: white;
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
      display: none;
      align-items: center;
      justify-content: center;
      color: var(--dark);
      cursor: pointer;
    }

    .group-pill {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 999;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      font-size: 12px;
      font-weight: 700;
      color: var(--dark);
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(226, 232, 240, 0.8);
    }

    /* Custom Leaflet Popup */
    .custom-popup .leaflet-popup-content-wrapper {
      border-radius: 14px;
      padding: 4px 6px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }
    .popup-card h4 {
      font-size: 14px;
      font-weight: 800;
      color: var(--dark);
      margin-bottom: 4px;
    }
    .popup-card p {
      font-size: 12px;
      color: var(--slate);
      margin-bottom: 6px;
    }
    .popup-card a {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--accent);
      text-decoration: none;
    }

    /* Responsive Design */
    @media (max-width: 900px) {
      body {
        position: relative;
      }
      #sidebar {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        max-width: 380px;
        transform: translateX(-100%);
      }
      #sidebar.open {
        transform: translateX(0);
      }
      .mobile-nav-toggle {
        display: flex;
      }
      .backdrop {
        position: absolute;
        inset: 0;
        background: rgba(15, 23, 42, 0.4);
        z-index: 999;
        display: none;
      }
      .backdrop.show {
        display: block;
      }
    }

    @media (max-width: 480px) {
      #sidebar {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="backdrop" id="backdrop" onclick="toggleSidebar()"></div>

  <!-- Mobile Toggle Button -->
  <button class="mobile-nav-toggle" onclick="toggleSidebar()" aria-label="Toggle Menu">
    <i class="fa-solid fa-bars"></i>
  </button>

  <!-- Group Badge -->
  <div class="group-pill">
    <i class="fa-solid fa-users text-emerald-600" style="color: #059669;"></i>
    <span>15 Travelers • Dec 24–29, 2026</span>
  </div>

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="brand-header">
      <div class="brand-badge">
        <i class="fa-solid fa-compass"></i> Route Expedition
      </div>
      <h1>Meghalaya & Kamakhya</h1>
      <div class="brand-meta">
        <span><i class="fa-regular fa-calendar"></i> 6 Days Circuit</span>
        <span><i class="fa-solid fa-car"></i> 2x Tempo Travellers</span>
      </div>
    </div>

    <!-- Filter Buttons -->
    <div class="filter-wrapper">
      <div class="chip-group">
        <button class="filter-btn active" onclick="setDayFilter('all', this)">
          <i class="fa-solid fa-route"></i> Full Circuit
        </button>
        <button class="filter-btn" onclick="setDayFilter(1, this)">Day 1</button>
        <button class="filter-btn" onclick="setDayFilter(2, this)">Day 2</button>
        <button class="filter-btn" onclick="setDayFilter(3, this)">Day 3</button>
        <button class="filter-btn" onclick="setDayFilter(4, this)">Day 4</button>
        <button class="filter-btn" onclick="setDayFilter(5, this)">Day 5</button>
        <button class="filter-btn" onclick="setDayFilter(6, this)">Day 6</button>
      </div>
    </div>

    <!-- Stop Content List -->
    <div class="content-area" id="itineraryContent">
      <!-- Dynamic cards rendered here -->
    </div>
  </aside>

  <!-- Interactive Map View -->
  <main id="map"></main>

  <!-- Leaflet & App JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Itinerary & Location GeoData
    const tourData = [
      {
        day: 1,

        title: "Guwahati Arrival & Sumer",

        stops: [
          {

            mapLink: "https://www.google.com/maps/search/?api=1&query=Guwahati+Airport"
          },
          {
            name: "Nalari Resort, Sumer / Umsning",
            coords: [25.7534, 91.8920],
            desc: "Check-in at ~9:45 PM. Bypasses Shillong city night traffic. Overnight stay.",
            trek: "Stay",
            trekClass: "trek-zero",
            mapLink: "https://www.google.com/maps/search/?api=1&query=Nalari+Resort+Sumer+Meghalaya"
          }
        ]
      },
      {
        day: 2,
        date: "25 Dec (Friday)",
        title: "Laitlum, Krang Shuri & Shnongpdeng",
        color: "#059669",
        stops: [
          {
            name: "Laitlum Grand Canyon",
            coords: [25.4678, 91.9056],
            desc: "Morning gorge panoramas and sweeping valley meadows via Shillong bypass.",
            trek: "Zero to Easy",
            trekClass: "trek-zero",
            mapLink: "https://www.google.com/maps/search/?api=1&query=Laitlum+Canyon+Meghalaya"
          },
          {
            name: "Krang Shuri Waterfalls",
            coords: [25.3262, 92.1797],
            desc: "Turquoise plunge pool and natural limestone cave ledge.",
            trek: "Moderate (150-200 Steps)",
            trekClass: "trek-mod",
            mapLink: "https://www.google.com/maps/search/?api=1&query=Krang+Shuri+Waterfalls+Meghalaya"
          },
          {
            name: "Shnongpdeng (Umngot River)",
            coords: [25.2018, 92.0526],
            desc: "Crystal-clear boat rides, pebble beach walks and suspension bridge.",
            trek: "Easy Walk",
            trekClass: "trek-easy",
            mapLink: "https://www.google.com/maps/search/?api=1&query=Shnongpdeng+Dawki+Meghalaya"
          },
          {
            name: "Hillside Cottage, Pynursla",
            coords: [25.3090, 91.8988],
            desc: "Uphill ridge drive from Dawki before evening winter mist. Overnight stay.",
            trek: "Stay",
            trekClass: "trek-zero",
            mapLink: "https://www.google.com/maps/search/?api=1&query=Pynursla+Meghalaya"
          }
        ]
      },
      {
        day: 3,
        date: "26 Dec (Saturday)",
        title: "Sohra (Cherrapunji) Cascades & Caves",
        color: "#2563eb",
        stops: [
          {
            name: "Wei Sawdong Falls",
            coords: [25.2974, 91.6844],
            desc: "3-tiered emerald lagoon cascade. Challenging bamboo ladder climb down.",
            trek: "Steep / Active Trek",
            trekClass: "trek-hard",
            mapLink: "https://www.google.com/maps/search/?api=1&query=Wei+Sawdong+Falls+Cherrapunji"
          },
          {
            name: "Arwah Cave",
            coords: [25.2917, 91.7346],
            desc: "Gentle 700m valley cliff walk with prehistoric crustacean & fish fossils.",
            trek: "Easy Flat Walk",
            trekClass: "trek-easy",
            mapLink: "https://www.google.com/maps/search/?api=1&query=Arwah+Cave+Cherrapunji"
          },
          {

            desc: "India's highest plunge waterfall (zero trek from parking). (Note: Base trek is 4-5 hrs, skipped).",
            trek: "Zero Viewpoint",

            mapLink: "https://www.google.com/maps/search/?api=1&query=Nohkalikai+Falls+Cherrapunji"
          },
          {
            name: "Mawsmai Cave",
            coords: [25.2475, 91.7225],
            desc: "150m illuminated limestone cave with stalactites (requires slight stooping).",
            trek: "Easy-Moderate",
            trekClass: "trek-mod",
            mapLink: "https://www.google.com/maps/search/?api=1&query=Mawsmai+Cave+Cherrapunji"
          }
        ]
      },
      {
        day: 4,
        date: "27 Dec (Sunday)",
        title: "Countryside Route B to Mawphanlur",
        color: "#d97706",
        stops: [
          {
            name: "Mawkdok Dympep Valley Viewpoint",
            coords: [25.3722, 91.7766],
            desc: "V-shaped deep canyon viewpoint and roadside photography.",
            trek: "Zero Trek",
            trekClass: "trek-zero",
            mapLink: "https://www.google.com/maps/search/?api=1&query=Mawkdok+Dympep+Valley+Viewpoint"
          },
          {
            name: "Kyllang Rock Base",
            coords: [25.5772, 91.4939],
            desc: "Colossal granite monolith dome view from peaceful pine meadows.",
            trek: "Zero Trek",
            trekClass: "trek-zero",
            mapLink: "https://www.google.com/maps/search/?api=1&query=Kyllang+Rock+Mairang"
          },
          {
            name: "Markham Valley (Dommurok Ridge)",
            coords: [25.5410, 91.4120],
            desc: "Rolling highland meadows and panoramic mountain breeze roadside stop.",
            trek: "Zero Trek",
            trekClass: "trek-zero",
            mapLink: "https://www.google.com/maps/search/?api=1&query=Markham+Valley+Meghalaya"
          },
          {
            name: "Mawphanlur Lakes (L-JIST Homestay)",
            coords: [25.5342, 91.3524],
            desc: "7 freshwater natural lakes surrounded by grassy knolls. Check-in by 2:30 PM.",
            trek: "Easy Meadow Walk",
            trekClass: "trek-easy",
            mapLink: "https://www.google.com/maps/search/?api=1&query=Mawphanlur+Meghalaya"
          }
        ]
      },
      {
        day: 5,
        date: "28 Dec (Monday)",
        title: "Mawphanlur to Guwahati via Umiam",
        color: "#7c3aed",
        stops: [
          {
            name: "Umiam Lake Viewpoint (Barapani)",
            coords: [25.6667, 91.9000],
            desc: "Meghalaya's grandest reservoir. Lakeside views and lunch stop.",
            trek: "Zero Trek",
            trekClass: "trek-zero",
            mapLink: "https://www.google.com/maps/search/?api=1&query=Umiam+Lake+Viewpoint+Meghalaya"
          },
          {
            name: "Maa Kamakhya Temple (Evening Aarti)",
            coords: [26.1664, 91.7058],
            desc: "Sunset over Brahmaputra river & illuminated temple aarti at Nilachal Hill.",
            trek: "Paved Walk",
            trekClass: "trek-easy",
            mapLink: "https://www.google.com/maps/search/?api=1&query=Maa+Kamakhya+Temple+Guwahati"
          }
        ]
      },
      {
        day: 6,
        date: "29 Dec (Tuesday)",
        title: "Kamakhya Darshan & Departure",
        color: "#dc2626",
        stops: [
          {
            name: "Morning Kamakhya Darshan / Return",
            coords: [26.1664, 91.7058],
            desc: "Special VIP or early darshan slot, followed by transfer to Station / Airport.",
            trek: "Minimal",
            trekClass: "trek-zero",
            mapLink: "https://www.google.com/maps/search/?api=1&query=Kamakhya+Temple+Guwahati"
          }
        ]
      }
    ];

    // Initialize Map with CartoDB Voyager tiles (clean, beautiful, no token needed)
    const map = L.map('map', {
      zoomControl: false
    }).setView([25.6, 91.75], 9);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Free, beautiful, rock-solid basemap layers (NO API KEY EVER REQUIRED)
    const osmStandard = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 19
    });

    const esriWorldTopo = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ, TomTom, Intermap, iPC, USGS, METI, NRCAN, GeoBase, Kadaster NL, Ordnance Survey, Esri Japan, METI, Esri China (Hong Kong), and the GIS User Community',
      maxZoom: 18
    });

    const esriSatellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community',
      maxZoom: 18
    });

    // Default to clean World Topo Map (stunning mountain ridges of Meghalaya!)
    esriWorldTopo.addTo(map);

    const baseMaps = {
      "⛰️ Mountain Topo": esriWorldTopo,
      "🗺️ Detailed Roads": osmStandard,
      "🛰️ Satellite Imagery": esriSatellite
    };

    L.control.layers(baseMaps, null, { position: 'bottomleft' }).addTo(map);

    let activeMarkers = [];
    let activePolylines = [];

    // Custom Marker Creator
    function createCustomMarker(color, label) {
      return L.divIcon({
        className: 'custom-div-icon',
        html: `<div style="
          background: ${color};
          width: 28px;
          height: 28px;
          border-radius: 50%;
          border: 3px solid white;
          box-shadow: 0 4px 10px rgba(0,0,0,0.3);
          display: flex;
          align-items: center;
          justify-content: center;
          color: white;
          font-weight: 800;
          font-size: 11px;">${label}</div>`,
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });
    }

    // Render Sidebar Cards
    function renderSidebar(filteredDay = 'all') {
      const container = document.getElementById('itineraryContent');
      container.innerHTML = '';

      const daysToRender = filteredDay === 'all' 
        ? tourData 
        : tourData.filter(d => d.day === parseInt(filteredDay));

      daysToRender.forEach(day => {
        const card = document.createElement('div');
        card.className = 'day-card';
        card.innerHTML = `
          <div class="day-card-header">
            <div class="day-title">
              <span style="color: ${day.color};"><i class="fa-solid fa-calendar-day"></i></span>
              <span>Day ${day.day}: ${day.title}</span>
            </div>
            <div class="day-date">${day.date}</div>
          </div>
          <ul class="stop-list">
            ${day.stops.map((stop, idx) => `
              <li class="stop-item" onclick="focusLocation(${stop.coords[0]}, ${stop.coords[1]}, '${stop.name}')">
                <div class="stop-dot" style="background: ${day.color};"></div>
                <div class="stop-header">
                  <span class="stop-name">${stop.name}</span>
                  <span class="badge-trek ${stop.trekClass}">${stop.trek}</span>
                </div>
                <p class="stop-desc">${stop.desc}</p>
                <div class="stop-links">
                  <a class="map-link-btn" href="${stop.mapLink}" target="_blank" onclick="event.stopPropagation()">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> Open in Maps / Photos
                  </a>
                </div>
              </li>
            `).join('')}
          </ul>
        `;
        container.appendChild(card);
      });
    }

    // Plot Route & Markers on Map
    function plotMap(filteredDay = 'all') {
      // Clear old layers
      activeMarkers.forEach(m => map.removeLayer(m));
      activePolylines.forEach(p => map.removeLayer(p));
      activeMarkers = [];
      activePolylines = [];

      const bounds = L.latLngBounds([]);
      const daysToPlot = filteredDay === 'all' 
        ? tourData 
        : tourData.filter(d => d.day === parseInt(filteredDay));

      daysToPlot.forEach(day => {
        const latlngs = [];

        day.stops.forEach((stop, index) => {
          const marker = L.marker(stop.coords, {
            icon: createCustomMarker(day.color, day.stops.length > 1 ? index + 1 : 'D' + day.day)
          }).addTo(map);

          marker.bindPopup(`
            <div class="popup-card">
              <div style="font-size: 11px; font-weight: 700; color: ${day.color}; text-transform: uppercase;">Day ${day.day} • ${day.date}</div>
              <h4>${stop.name}</h4>
              <p>${stop.desc}</p>
              <div style="margin-bottom: 6px;"><span class="badge-trek ${stop.trekClass}">${stop.trek}</span></div>
              <a href="${stop.mapLink}" target="_blank">View on Google Maps &rarr;</a>
            </div>
          `, { className: 'custom-popup' });

          activeMarkers.push(marker);
          latlngs.push(stop.coords);
          bounds.extend(stop.coords);
        });

        // Add Polyline connecting stops of that day
        if (latlngs.length > 1) {
          const line = L.polyline(latlngs, {
            color: day.color,
            weight: 4.5,
            opacity: 0.85,
            dashArray: filteredDay === 'all' ? '6, 8' : null
          }).addTo(map);
          activePolylines.push(line);
        }
      });

      // Fit map to view all points
      if (bounds.isValid()) {
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 13 });
      }
    }

    // Filter Trigger
    function setDayFilter(day, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      renderSidebar(day);
      plotMap(day);

      // On mobile, keep sidebar open briefly or close if user taps full map
      if (window.innerWidth <= 900 && day !== 'all') {
        toggleSidebar(false);
      }
    }

    // Pan to specific landmark
    function focusLocation(lat, lng, name) {
      map.flyTo([lat, lng], 13, { duration: 1.2 });
      activeMarkers.forEach(m => {
        const c = m.getLatLng();
        if (Math.abs(c.lat - lat) < 0.001 && Math.abs(c.lng - lng) < 0.001) {
          m.openPopup();
        }
      });
      if (window.innerWidth <= 900) {
        toggleSidebar(false);
      }
    }

    // Mobile Sidebar Drawer Toggle
    function toggleSidebar(forceState) {
      const sb = document.getElementById('sidebar');
      const bd = document.getElementById('backdrop');
      const isCurrentlyOpen = sb.classList.contains('open');
      const shouldOpen = forceState !== undefined ? forceState : !isCurrentlyOpen;

      if (shouldOpen) {
        sb.classList.add('open');
        bd.classList.add('show');
      } else {
        sb.classList.remove('open');
        bd.classList.remove('show');
      }
    }

    // Init
    renderSidebar('all');
    plotMap('all');
  </script>
</body>
</html>
